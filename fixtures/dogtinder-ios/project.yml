name: DogTinder
options:
  bundleIdPrefix: com.natively
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
targets:
  DogTinder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DogTinder
    info:
      path: DogTinder/Info.plist
      properties:
        CFBundleDisplayName: DogTinder
        CFBundleName: DogTinder
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natively.dogtinder
        PRODUCT_NAME: DogTinder
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  DogTinder:
    build:
      targets:
        DogTinder: all
    run:
      config: Debug
